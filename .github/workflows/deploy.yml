name: Deploy

# Every push to main: wait for the maintainer's approval, then migrations and the API, then the
# site, which calls the API. The tests already passed on the pull request (ci.yml).
on:
  push:
    branches: [main]

permissions:
  contents: read

# One deploy at a time, and a newer push never cancels one halfway.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  # The single approval. `production-approval` has the maintainer as required reviewer and no
  # secrets; the deploy jobs use `production`, which holds the Cloudflare token and only main
  # can use. Two jobs on the same reviewed environment would each ask for approval.
  approve:
    name: approve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-approval
    steps:
      - run: echo "Deploying ${GITHUB_SHA}, approved for production."

  deploy-api:
    name: deploy-api
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      # The Makefile's guard stops here if main moved on while this run waited for approval;
      # the newer run deploys instead.
      - run: make migration CONFIRM=yes
      - run: make build_and_deploy_backend CONFIRM=yes

  deploy-web:
    name: deploy-web
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: make build_and_deploy_frontend CONFIRM=yes
