name: Set up the API
description: Node 22 and the API's dependencies (api/), from the lockfile.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: api/package-lock.json
    - run: npm ci
      shell: bash
      working-directory: api
