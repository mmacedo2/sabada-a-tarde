name: Set up the site
description: Bun and the site's dependencies (repo root), from the frozen lockfile.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.3
    - run: bun install --frozen-lockfile
      shell: bash
